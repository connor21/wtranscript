version: '3.8'

services:
  transcription-app:
    build: .
    container_name: media-transcription-app
    ports:
      - "8501:8501"
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=1000
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  model-cache:
